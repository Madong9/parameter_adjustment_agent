[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-training-agent"
version = "0.1.0"
description = "Natural-language orchestration for Unitree reinforcement-learning experiments"
requires-python = ">=3.8"
dependencies = [
  "pydantic>=1.10,<2",
  "PyYAML>=5.4",
  "numpy>=1.20,<2",
  "matplotlib>=3.4",
  "opencv-python-headless>=4.8,<5",
  "pandas>=1.5,<2.1",
  "pyarrow>=12,<18",
  "tensorboard>=2.10",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_training_agent*"]

[tool.setuptools.package-data]
rl_training_agent = ["prompts/*.md", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
